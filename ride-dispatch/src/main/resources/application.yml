spring:
  application:
    name: ride-dispatch
  main:
    web-application-type: none

dubbo:
  application:
    name: ride-dispatch
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2182}
  protocol:
    name: dubbo
    port: ${DISPATCH_DUBBO_PORT:20906}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0

dispatch:
  offer-limit: 20

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%t] %-40.40logger{39} : %m%n"
