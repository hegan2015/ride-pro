# docker profile：claim-shared 容器 MySQL；由 run.sh --docker 激活（SPRING_PROFILES_ACTIVE=docker）。
# 口令来自 ~/.config/ride-pro/docker.env，仓库不落密钥。
spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/ride_support?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      schema-locations: classpath:schema-mysql.sql