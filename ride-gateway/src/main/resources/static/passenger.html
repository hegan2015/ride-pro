<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>乘客端 · ride-pro</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --muted:#8a94a6; --line:#e6e9f0;
  --green:#00b578; --red:#fa5151; --amber:#ff8f1f; --blue:#10aeff; --orange:#ff6a00; --orange-d:#e85d04;
  --soft:#fff4ea; --shadow:0 2px 12px rgba(31,36,48,.08); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
body.elder{font-size:17px}
body.hc{--bg:#ffffff;--card:#ffffff;--text:#000000;--muted:#333333;--line:#000000;--orange:#c43e00;--orange-d:#a33400}
body.hc .card,body.hc .sheet,body.hc .modal{border:2px solid #000}
body.elder .hide-elder{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:9px 14px;background:var(--orange);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
button.green{background:var(--green)} button.red{background:var(--red)} button.amber{background:var(--amber)}
button.block{width:100%} button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.sec{font-size:13px;font-weight:700;margin:14px 0 8px;color:var(--text)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef1f6;color:var(--muted)}
.badge.ok{background:#e6f9f1;color:var(--green)} .badge.err{background:#feecec;color:var(--red)}
.badge.warn{background:#fff4e6;color:var(--amber)} .badge.info{background:#e8f7ff;color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{text-align:right;font-weight:600}
/* top */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.top .name{font-weight:700}
.iconbtn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;padding:0;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.iconbtn.has .dot{display:block}
#wsState{font-size:10px}
/* panes */
.pane{display:none;flex:1;overflow-y:auto;padding:12px 12px 84px}
.pane.active{display:block}
#pane-home{padding:0;position:relative;overflow:hidden}
#map{width:100%;height:100%;position:absolute;inset:0;background:linear-gradient(160deg,#eef4ee,#f5f6fa)}
.home-top{position:absolute;top:12px;left:12px;right:12px;z-index:5}
.searchbar{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;display:flex;align-items:center;gap:9px;font-weight:600;color:var(--muted);cursor:pointer}
.searchbar .mag{color:var(--orange)}
.quick{display:flex;gap:8px;margin-top:9px}
.quick button{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:6px 13px;box-shadow:var(--shadow)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(31,36,48,.14);padding:16px 16px calc(16px + 62px);max-height:72%;overflow-y:auto}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.odrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.odrow .pin{width:9px;height:9px;border-radius:50%;flex:none}
.odrow .txt{flex:1;font-weight:600}
.odrow .edit{color:var(--muted);font-size:12px}
.svc{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.svc button{flex:none;background:#f4f6fa;color:var(--text);border:1.5px solid transparent;border-radius:12px;padding:8px 13px;text-align:left}
.svc button.on{background:var(--soft);border-color:var(--orange);color:var(--orange-d)}
.svc .p{display:block;font-size:12px;font-weight:700}
.couponrow{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;color:var(--orange-d);font-weight:600;cursor:pointer;font-size:13px}
.fareline{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0}
.fareline .big{font-size:24px;font-weight:800;color:var(--orange-d)}
.callbtn{width:100%;padding:14px;font-size:16px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--amber));box-shadow:0 6px 16px rgba(255,106,0,.3)}
/* order card in sheet */
.drivercard{display:flex;gap:11px;align-items:center;background:#f8f9fc;border-radius:12px;padding:11px}
.drivercard .avatar{width:44px;height:44px;font-size:18px}
.drivercard . plates{font-weight:800}
.eta{background:#e8f7ff;color:var(--blue);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px;display:inline-block;margin-top:6px}
.timeline{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}
.timeline .step{font-size:11px;color:var(--muted);background:#f4f6fa;border-radius:999px;padding:3px 9px}
.timeline .step.done{color:var(--green);background:#e6f9f1}
.timeline .step.active{color:#fff;background:var(--orange)}
.primary-big{width:100%;padding:13px;font-size:15px;border-radius:12px}
.actrow{display:flex;gap:8px;margin-top:9px}
.actrow button{flex:1;font-size:12.5px;padding:8px 4px}
/* safety fab */
.fab{position:absolute;right:12px;top:150px;z-index:7;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;padding:0}
/* bottom nav */
.bottomnav{position:absolute;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:0}
.bottomnav button .ico{font-size:20px}
.bottomnav button.active{color:var(--orange-d);font-weight:700}
/* lists */
.hist-item{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:9px;cursor:pointer}
.hist-route{font-weight:700}
.stats{display:flex;gap:9px}.stat{flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px;text-align:center}
.stat .n{font-size:19px;font-weight:800}.stat .n.green{color:var(--green)}.stat .n.amber{color:var(--amber)}
.stat .l{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.filters>div{flex:1;min-width:110px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.money{font-size:32px;font-weight:800;color:var(--orange-d)}
.log{background:#fff;border-radius:12px;padding:10px;max-height:420px;overflow-y:auto}
.log .item{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.log .t{color:var(--muted);margin-right:6px}.log .e{font-weight:700;color:var(--blue)}
/* modal / sheet-overlay / drawer / toast (common.js) */
.modal-overlay,.drawer-overlay{position:fixed;inset:0;background:rgba(31,36,48,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{font-size:16px}
.modal .btns{justify-content:flex-end}
.stars{font-size:26px;color:#d9dde5;cursor:pointer}.stars .on{color:var(--amber)}
.drawer-overlay{align-items:stretch;justify-content:flex-end}
.drawer{background:#fff;width:100%;max-width:520px;height:100%;overflow-y:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.wide{max-width:520px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.drawer-head h3{font-size:16px}
.drawer-close{background:#f4f6fa;color:var(--text);border:0;width:32px;height:32px;border-radius:50%;padding:0}
.map.mini{width:100%;height:160px;border-radius:12px;background:#eef4ee}
.vtl{padding-left:6px}.vtl-item{display:flex;gap:9px;padding:5px 0;position:relative}
.vtl-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:5px;flex:none}
.vtl-label{font-weight:600;font-size:13px}
#toastStack{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:90vw}
.toast{background:rgba(31,36,48,.92);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;box-shadow:var(--shadow);transition:.3s}
.toast.ok{background:var(--green)}.toast.warn{background:var(--amber)}.toast.err{background:var(--red)}
.toast.out{opacity:0;transform:translateY(-8px)}
/* sheet content helpers */
.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.listitem:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eef1f6;color:var(--muted)}
.tag.ok{background:#e6f9f1;color:var(--green)}.tag.warn{background:#fff4e6;color:var(--amber)}.tag.err{background:#feecec;color:var(--red)}
.sos{width:100%;padding:15px;font-size:16px;background:var(--red);border-radius:12px;box-shadow:0 6px 16px rgba(250,81,81,.3)}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--text);border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:13px 2px;font-size:14px;font-weight:600}
.menu button .arr{color:var(--muted)}
.membercard{background:linear-gradient(135deg,#3a3f52,#20242f);color:#fff;border-radius:14px;padding:14px}
.membercard .lv{font-weight:800;color:var(--amber)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chips button{background:#f4f6fa;color:var(--text);border:1.5px solid transparent;border-radius:999px;font-size:12.5px;padding:6px 12px}
.chips button.on{background:var(--soft);border-color:var(--orange);color:var(--orange-d)}
.imbox{max-height:260px;overflow-y:auto;background:#f8f9fc;border-radius:12px;padding:10px;margin:10px 0}
.immsg{margin:6px 0;display:flex}.immsg.me{justify-content:flex-end}
.immsg span{max-width:75%;border-radius:12px;padding:8px 11px;font-size:13px;background:#fff;box-shadow:var(--shadow)}
.immsg.me span{background:var(--orange);color:#fff}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="avatar" id="avatar">?</span>
    <div style="flex:1">
      <div class="name" id="chipName">选择身份</div>
      <div class="muted small" id="wsState">未连接</div>
    </div>
    <button class="iconbtn" id="btnBell" title="消息">🔔<span class="dot"></span></button>
    <button class="iconbtn" id="btnShield" title="安全中心">🛡️</button>
  </header>

  <!-- 叫车（地图首页） -->
  <div class="pane active" id="pane-home">
    <canvas id="map"></canvas>
    <div class="home-top">
      <div class="searchbar" id="searchDest"><span class="mag">🔍</span><span id="searchDestTxt">你要去哪儿？</span></div>
      <div class="quick hide-elder">
        <button data-quick="home">🏠 回家</button>
        <button data-quick="company">🏢 去公司</button>
        <button id="btnAddrMgr">📍 常用地址</button>
        <button id="btnGps">🛰️ 定位</button>
      </div>
      <div class="couponrow" id="campaignBanner" style="display:none;margin-top:9px"></div>
    </div>
    <button class="fab" id="fabShield" title="安全中心">🛡️</button>
    <div class="sheet" id="homeSheet">
      <div class="grip"></div>
      <div id="callView">
        <div class="odrow" id="rowOrigin"><span class="pin" style="background:var(--green)"></span><span class="txt" id="originTxt">点击设置起点</span><span class="edit">修改</span></div>
        <div class="muted small" id="pickupHint" style="display:none;padding:4px 0;cursor:pointer;color:var(--teal,#0e9f8a)"></div>
        <div class="odrow" id="rowDest"><span class="pin" style="background:var(--red)"></span><span class="txt" id="destTxt">点击设置终点</span><span class="edit">修改</span></div>
        <div class="svc" id="svcRow"></div>
        <div class="couponrow" id="couponRow"><span>🎟️ 优惠券</span><span id="couponTxt">选择券 ›</span></div>
        <div class="chips" id="comfortRow"><button data-cf="安静">🤫 安静</button><button data-cf="空调">❄️ 空调</button><button data-cf="音乐">🎵 音乐</button><button data-cf="后备箱">🧳 后备箱</button></div>
        <div class="spread" style="margin:6px 0"><span class="muted small">加价调度（元，可选，完单归司机）</span><input id="tipAmount" type="number" min="0" value="0" style="width:90px"></div>
        <div class="fareline"><span class="muted small" id="fareMeta">预估价</span><span class="big" id="fareBig">--</span></div>
        <div id="fareDetail"></div>
        <button class="callbtn" id="btnCall">呼叫车辆</button>
        <p class="muted small" style="margin-top:8px" id="callHint">支持多车型接力呼叫：首选无应答自动切换备选车型。</p>
      </div>
      <div id="orderView" style="display:none">
        <div class="spread"><span class="badge info" id="orderId">--</span><span id="orderStatus"></span></div>
        <div class="timeline" id="timeline"></div>
        <div class="drivercard" id="driverCard" style="display:none">
          <span class="avatar" id="dAvatar">司</span>
          <div style="flex:1">
            <div class="plates" id="dName">--</div>
            <div class="muted small" id="dCar">--</div>
            <span class="eta" id="dEta" style="display:none"></span>
          </div>
          <button class="ghost" id="btnIm" style="flex:none">💬 联系</button>
        </div>
        <div class="kv"><span class="k">行程</span><span class="v" id="oRoute">--</span></div>
        <div class="kv"><span class="k">预估 / 实际</span><span class="v" id="oFee">--</span></div>
        <div class="kv" id="oCancelFeeRow" style="display:none"><span class="k">取消费</span><span class="v" id="oCancelFee">--</span></div>
        <div class="kv" id="oComfortRow" style="display:none"><span class="k">舒适偏好</span><span class="v" id="oComfort">--</span></div>
        <span class="eta" id="remainEta" style="display:none"></span>
        <button class="primary-big" id="btnPrimary" disabled>--</button>
        <div class="actrow">
          <button class="ghost" id="btnShare">分享</button>
          <button class="ghost" id="btnModifyDest">改目的地</button>
          <button class="ghost" id="btnSafety">安全</button>
          <button class="ghost" id="btnDetail">详情</button>
          <button class="ghost" id="btnComplaint">客服</button>
          <button class="ghost" id="btnTip" style="display:none">打赏</button>
        </div>
        <p class="muted small" id="primaryHint" style="margin-top:8px"></p>
      </div>
    </div>
  </div>

  <!-- 订单 -->
  <div class="pane" id="pane-history">
    <div class="stats" id="histStats" style="margin-bottom:12px"></div>
    <div class="card">
      <div class="filters">
        <div><label>状态</label><select id="hStatus"><option value="">全部</option></select></div>
        <div><label>开始</label><input type="date" id="hFrom"></div>
        <div><label>结束</label><input type="date" id="hTo"></div>
        <button id="hSearch">查询</button>
      </div>
      <div id="histList"></div>
      <div class="pager" id="histPager"></div>
    </div>
  </div>

  <!-- 钱包 -->
  <div class="pane" id="pane-wallet">
    <div class="card">
      <div class="muted small">钱包余额</div>
      <div class="money" id="balance">¥--</div>
      <label>充值金额（元）</label>
      <input id="topupAmount" type="number" value="100" min="1">
      <div class="btns"><button class="ghost" data-amt="50">¥50</button><button class="ghost" data-amt="100">¥100</button><button class="ghost" data-amt="200">¥200</button></div>
      <div class="btns"><button class="green block" id="btnTopup">充值</button></div>
      <div class="spread" style="margin-top:12px"><span class="muted small">免密自动扣款</span><input type="checkbox" id="autoPayToggle" style="width:auto"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="spread"><b>资金流水</b><button class="ghost" id="wSearch">刷新</button></div>
      <div class="filters"><div><label>类型</label><select id="wBiz"><option value="">全部</option></select></div></div>
      <div id="walletLedger"></div>
      <div class="pager" id="walletPager"></div>
    </div>
  </div>

  <!-- 我的 -->
  <div class="pane" id="pane-me">
    <div class="membercard">
      <div class="spread"><span class="lv" id="mLevel">普通会员</span><span id="mPoints">0 积分</span></div>
      <div class="small" style="opacity:.8;margin-top:4px" id="mSpent">累计消费 ¥0.00</div>
    </div>
    <div class="card menu" style="margin-top:12px">
      <button data-me="coupons">🎟️ 优惠券<span class="arr">›</span></button>
      <button data-me="invoice">🧾 发票<span class="arr">›</span></button>
      <button data-me="address">📍 地址管理<span class="arr">›</span></button>
      <button data-me="contacts">🆘 紧急联系人<span class="arr">›</span></button>
      <button data-me="notifications">🔔 消息中心<span class="arr">›</span></button>
      <button data-me="complaint">🎧 客服/投诉<span class="arr">›</span></button>
      <button data-me="invite">🎁 邀请有礼<span class="arr">›</span></button>
      <button data-me="settings">⚙️ 设置<span class="arr">›</span></button>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="spread"><span class="muted small">长辈模式（大字体/简化）</span><input type="checkbox" id="elderToggle" style="width:auto"></div>
    </div>
    <p class="muted small" style="margin:12px 4px"><a href="index.html" style="color:var(--muted)">门户</a> · <a href="driver.html" style="color:var(--muted)">司机端</a> · <a href="admin.html" style="color:var(--muted)">管理端</a></p>
  </div>

  <nav class="bottomnav">
    <button data-tab="home" class="active"><span class="ico">🚕</span>叫车</button>
    <button data-tab="history"><span class="ico">📋</span>订单</button>
    <button data-tab="wallet"><span class="ico">💰</span>钱包</button>
    <button data-tab="me"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<script src="common.js"></script>
<script>
const STEPS=['DISPATCHING','ACCEPTED','ARRIVED','IN_PROGRESS','COMPLETED','PAID'];
const SVC=[{k:'EXPRESS',n:'快车'},{k:'TEHUI',n:'特惠'},{k:'CARPOOL',n:'拼车'},{k:'YOUXIANG',n:'优享'},{k:'PREMIER',n:'专车'},{k:'LUXURY',n:'豪华'},{k:'TAXI',n:'出租车'}];
let passenger=null,ws=null,order=null,map=null,rated=false;
let origin=null,dest=null,mode='origin',serviceType='EXPRESS',svcSel=['EXPRESS'],fallbackSvcs=[];
let driverPos=null,driverInfo=null,histPage=1,walletPage=1;
let quotes={},coupon=null,deviationRaised=false,recording=false;
let cfSel=new Set(),payChannel='WALLET',mediaRec=null,recChunks=[],recUrl=null;
const $=id=>document.getElementById(id);

// ---- tab ----
function switchTab(n){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+n));
  if(n==='history')loadHistory(1);
  if(n==='wallet'){refreshWallet();loadWalletLedger(1);}
  if(n==='me')loadMember();
  if(n==='home'&&map)setTimeout(()=>map.resize(),50);
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

// ---- identity ----

    <div class="btns"><button class="block" id="mUse">使用选中身份</button></div>

function selectPassenger(p){
  passenger=p;localStorage.setItem('ride.passengerId',p.id);
  $('chipName').textContent=p.name;$('avatar').textContent=p.name.charAt(0);
  $('autoPayToggle').checked=!!p.autoPay;
  if(ws)ws.close();
  ws=connectWS('passenger',p.id,onEvent,setWsState);
  order=null;rated=false;renderOrder();refreshWallet();loadActiveOrder();loadMember();loadNotifications();
}
async function refreshWallet(){
  if(!passenger)return;
  try{const w=await api('GET','/api/wallets/'+passenger.id);$('balance').textContent=yuan(w.balance);}catch{}
}
async function loadActiveOrder(){
  if(!passenger)return;
  const list=await api('GET','/api/orders?passengerId='+passenger.id);
  const a=list.find(o=>ACTIVE_STATUSES.includes(o.status));
  if(a){order=a;rated=false;deviationRaised=false;renderOrder();}
  else if(order&&['PAID','CANCELLED','EXPIRED','REFUNDED'].includes(order.status))renderOrder();
}

// ---- events ----
function onEvent(msg){
  const d=msg.data||{};
  if(msg.event==='KICKED')return toast('同一身份在其他页面登录，本页已停止重连','warn');
  if(msg.event==='CONNECTED'){refreshWallet();if(order)refreshOrder(order.id);else loadActiveOrder();return;}
  if(msg.event==='DRIVER_LOCATION'){if(order&&d.orderId===order.id){driverPos={lat:d.lat,lng:d.lng};drawMarkers();updateEta();guardTrip();}return;}
  const oid=d.orderId;
  if(oid&&(!order||order.id===oid)){
    refreshOrder(oid);
    const tips={DRIVER_ACCEPTED:['司机已接单，正在赶来','ok'],DRIVER_ARRIVED:['司机已到达上车点','ok'],TRIP_STARTED:['行程开始','info'],TRIP_COMPLETED:['行程结束，请支付车费','warn'],ORDER_PAID:['支付成功，感谢乘坐','ok'],ORDER_CANCELLED:['订单已取消','warn'],DRIVER_CANCELLED:['司机取消，正在重新派单','warn'],ORDER_EXPIRED:['附近暂无司机','err'],ORDER_REFUNDED:['退款已到账','ok'],ORDER_RATED:['收到司机评价','info'],PAYMENT_REMINDER:['请及时支付车费','warn']};
    if(tips[msg.event])toast(tips[msg.event][0],tips[msg.event][1]);
    if(msg.event==='ORDER_PAID'){refreshWallet();rated=false;onPaid();}
    if(msg.event==='SERVICE_FALLBACK')toast('首选车型无应答，已接力备选车型重新派单','warn');
    if(msg.event==='DEST_CHANGED')toast('目的地已修改，预估价已更新','info');
    if(msg.event==='ORDER_REFUNDED'||msg.event==='ORDER_CANCELLED')refreshWallet();
    if(msg.event==='ORDER_EXPIRED')tryFallback();
  }
}
async function refreshOrder(id){try{order=await api('GET','/api/orders/'+id);renderOrder();}catch{}}

// ---- multi-service fallback ----
function tryFallback(){
  if(!fallbackSvcs.length||!origin||!dest)return;
  const next=fallbackSvcs.shift();
  toast('首选车型无应答，切换 '+SVC.find(s=>s.k===next).n+' 重新呼叫','warn');
  serviceType=next;paintSvc();
  doCall(true);
}

// ---- order render ----
function renderOrder(){
  const has=!!order;
  $('callView').style.display=has?'none':'block';
  $('orderView').style.display=has?'block':'none';
  $('btnCall').disabled=!!(has&&ACTIVE_STATUSES.includes(order.status));
  if(!has){drawMarkers();return;}
  $('orderId').textContent=order.id;
  $('orderStatus').innerHTML=statusBadge(order.status);
  const idx=STEPS.indexOf(order.status);
  $('timeline').innerHTML=STEPS.map((s,i)=>{let c='step';if(['CANCELLED','EXPIRED','REFUNDED'].includes(order.status))c+=i===0?' active':'';else if(i<idx)c+=' done';else if(i===idx)c+=' active';return `<span class="${c}">${STATUS_LABEL[s]}</span>`;}).join('');
  $('oRoute').textContent=`${order.originName||'--'} → ${order.destName||'--'}`;
  $('oFee').textContent=`${yuan(order.estimateFee)} / ${yuan(order.actualFee)}`;
  $('oCancelFeeRow').style.display=order.cancelFee?'flex':'none';
  $('oCancelFee').textContent=yuan(order.cancelFee);
  $('oComfortRow').style.display=order.comfort?'flex':'none';
  $('oComfort').textContent=order.comfort||'';
  $('btnTip').style.display=order.status==='PAID'?'':'none';
  const re=$('remainEta');
  if(order.status==='IN_PROGRESS'&&driverPos&&dest){const km=distKm(driverPos,dest);re.style.display='inline-block';re.textContent=`剩余 ${km.toFixed(1)} km · 约 ${Math.max(1,Math.round(km/0.5))} 分钟`;}
  else re.style.display='none';
  const dc=$('driverCard');
  if(order.driverId){
    dc.style.display='flex';
    $('dName').textContent=(order.driverName||'司机')+' · '+(order.driverCarNo||'');
    $('dCar').textContent=(driverInfo&&driverInfo.carModel)||SERVICE_LABEL[order.serviceType]||'';
    $('dAvatar').textContent=(order.driverName||'司').charAt(0);
    loadDriverInfo(order.driverId);
    updateEta();
  } else dc.style.display='none';
  const btn=$('btnPrimary'),hint=$('primaryHint');
  btn.disabled=false;btn.className='primary-big';hint.textContent='';
  switch(order.status){
    case 'DISPATCHING':btn.textContent='取消叫车';btn.classList.add('red');btn.onclick=cancelOrder;hint.textContent=`第 ${order.dispatchRound||1} 轮派单中 · 已等待 ${Math.max(0,Math.round((Date.now()-order.createdAt)/1000))}s · 无应答自动接力备选车型。`;break;
    case 'ACCEPTED':case 'ARRIVED':btn.textContent='取消订单';btn.classList.add('red');btn.onclick=cancelOrder;hint.textContent=cancelFeeHint();break;
    case 'IN_PROGRESS':btn.textContent='行程进行中…';btn.disabled=true;hint.textContent='司机正在送您前往目的地，安全中心全程守护。';break;
    case 'COMPLETED':btn.textContent=`支付车费 ${yuan(order.actualFee)}`;btn.classList.add('green');btn.onclick=payOrder;hint.textContent='按实际轨迹里程计价。';break;
    case 'PAID':
      if(!rated){btn.textContent='评价行程';btn.classList.add('amber');btn.onclick=rateOrder;}
      else{btn.textContent='再来一单';btn.classList.add('amber');btn.onclick=()=>{order=null;renderOrder();};}
      hint.textContent='支付完成，感谢乘坐。';break;
    default:btn.textContent='重新叫车';btn.classList.add('amber');btn.onclick=()=>{order=null;renderOrder();};hint.textContent=order.cancelReason?`原因：${order.cancelReason}`:'';
  }
  drawMarkers();
}
async function loadDriverInfo(id){
  try{driverInfo=await api('GET','/api/drivers/'+id);}catch{driverInfo=null;}
  if(order&&order.driverId===id&&driverInfo)$('dCar').textContent=`${driverInfo.carModel||''} · ${SERVICE_LABEL[driverInfo.serviceType]||''} · 服务分 ${(driverInfo.serviceScore??5).toFixed(2)}`;
}
function distKm(a,b){const R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function updateEta(){
  const el=$('dEta');
  if(!order||!driverPos||!['ACCEPTED','ARRIVED'].includes(order.status)||origin==null){el.style.display='none';return;}
  const km=distKm(driverPos,origin);
  el.style.display='inline-block';
  el.textContent=`距您 ${km.toFixed(1)} km · 约 ${Math.max(1,Math.round(km/0.5))} 分钟`;
}
function guardTrip(){
  if(!order||order.status!=='IN_PROGRESS'||!driverPos||!origin||!dest||deviationRaised)return;
  const total=distKm(origin,dest);if(total<0.5)return;
  const d1=distKm(origin,driverPos),d2=distKm(driverPos,dest);
  if(d1+d2>total*1.6+0.8){deviationRaised=true;api('POST','/api/support/safety/events',{userId:passenger.id,orderId:order.id,type:'DEVIATION',detail:'行程偏航检测'}).catch(()=>{});toast('检测到行程偏航，已记录并提醒安全中心','warn');}
}
function cancelFeeHint(){
  if(order.status==='ARRIVED')return '司机已到达，取消将收取取消费 ¥3.00（全额补偿司机）。';
  const left=order.acceptedAt?120000-(Date.now()-order.acceptedAt):120000;
  return left>0?`接单后 ${Math.ceil(left/1000)} 秒内免费取消，超时收取 ¥3.00。`:'已超过免费取消窗口，取消将收取 ¥3.00。';
}
async function cancelOrder(){
  const fee=order.status==='ARRIVED'||(order.status==='ACCEPTED'&&order.acceptedAt&&Date.now()-order.acceptedAt>120000);
  const ok=await confirmDialog(fee?'当前取消将收取 <b>¥3.00 取消费</b>（全额补偿司机），确认取消？':'确认取消该订单？','确认取消');
  if(!ok)return;
  try{await api('POST',`/api/orders/${order.id}/cancel?reason=`+encodeURIComponent('乘客主动取消'));fallbackSvcs=[];refreshOrder(order.id);refreshWallet();}catch(e){toast(e.message,'err');}
}
async function payOrder(){
  const fare=order.actualFare||order.fare;
  const ok=await confirmDialog(`<h3>确认支付车费</h3>${fareHtml(fare)}${coupon?`<div class="kv"><span class="k">优惠券</span><span class="v" style="color:var(--orange)">-${yuan(couponSave())}</span></div>`:''}
    <label>支付方式</label><select id="payCh"><option value="WALLET">钱包余额</option><option value="WECHAT">微信（演示）</option><option value="ALIPAY">支付宝（演示）</option><option value="CARD">银行卡（演示）</option></select>
    <p class="muted small" style="margin-top:8px">非钱包渠道为演示标记，实际结算走钱包；支付后司机自动恢复接单。</p>`,`确认支付 ${yuan(order.actualFee)}`);
  if(!ok)return;
  payChannel=(document.getElementById('payCh')||{}).value||'WALLET';
  await doPay();
}
async function doPay(){
  const btn=$('btnPrimary');btn.disabled=true;btn.textContent='支付中…';
  const oid=order.id;
  try{await api('POST',`/api/orders/${oid}/pay?channel=${payChannel}`);refreshOrder(oid);refreshWallet();}
  catch(e){
    if(!e.status){toast('网络异常，支付结果确认中，请勿重复支付','warn');pollPayResult(oid);return;}
    if((e.message||'').includes('余额不足')){renderOrder();await offerTopupAndPay();return;}
    toast(e.message,'err');renderOrder();
  }
}
function pollPayResult(orderId){
  let tries=0;
  const t=setInterval(async()=>{tries++;
    try{const o=await api('GET','/api/orders/'+orderId);
      if(o.status==='PAID'){clearInterval(t);order=o;rated=false;renderOrder();refreshWallet();onPaid();toast('支付已确认','ok');return;}
      if(order&&order.id===orderId){order=o;renderOrder();}
    }catch{}
    if(tries>=8){clearInterval(t);if(order&&order.id===orderId)renderOrder();}
  },2000);
}
async function offerTopupAndPay(){
  const w=await api('GET','/api/wallets/'+passenger.id).catch(()=>null);
  const gap=order.actualFee-(w?w.balance:0);
  if(gap<=0){toast('余额已更新，请重试支付','info');return;}
  const ok=await confirmDialog(`钱包余额不足（当前 ${yuan(w?w.balance:0)}），还差 <b>${yuan(gap)}</b>。充值差额并继续支付？`,'充值并支付');
  if(!ok)return;
  try{await api('POST','/api/wallets/topup',{userId:passenger.id,amount:gap,bizNo:'TOPUP-PAY-'+order.id});refreshWallet();await doPay();}catch(e){toast(e.message,'err');}
}
async function onPaid(){
  if(coupon){api('POST',`/api/support/coupons/redeem?couponId=${coupon.id}&orderId=${order.id}`).catch(()=>{});coupon=null;paintCoupon();}
  if(order&&order.actualFee)addMemberPoints(order.actualFee);
  loadNotifications();loadMember();
}
async function addMemberPoints(fare){
  try{await api('POST',`/api/support/member/points?userId=${passenger.id}&points=${Math.round(fare/100)}&spent=${fare}`);}catch{}
}
async function rateOrder(){

  if(!r)return;
  try{await api('POST',`/api/orders/${order.id}/rate`,{role:'passenger',score:r.score,comment:r.comment,tags:r.tags,anonymous:r.anonymous});rated=true;renderOrder();toast('评价已提交','ok');}catch(e){toast(e.message,'err');}
}
$('btnShare').onclick=async()=>{if(!order)return;try{const s=await api('POST','/api/share/'+order.id);const url=location.origin+s.path;await navigator.clipboard.writeText(url).catch(()=>{});api('POST','/api/support/safety/events',{userId:passenger.id,orderId:order.id,type:'SHARE',detail:'行程分享'}).catch(()=>{});toast('分享链接已复制','ok');}catch(e){toast(e.message,'err');}};

$('btnComplaint').onclick=()=>openComplaint(order&&order.id);
$('btnModifyDest').onclick=()=>order&&openAddressSearch('destOverride');

  if(!order||!order.driverId)return;
  const ok=await confirmDialog('打赏司机 <b>¥5.00</b> 感谢本次服务？从钱包划转。','打赏 ¥5');

  try{await api('POST','/api/wallets/transfer',{fromUserId:passenger.id,toUserId:order.driverId,amount:500,orderId:order.id,bizType:'TIP',requestId:'TIP-USER-'+order.id});refreshWallet();toast('打赏已送达司机','ok');}catch(e){toast(e.message,'err');}

$('btnGps').onclick=()=>{
  if(!navigator.geolocation)return toast('浏览器不支持定位','warn');
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=Math.min(40.12,Math.max(39.80,pos.coords.latitude)),lng=Math.min(116.65,Math.max(116.20,pos.coords.longitude));
    setPoint('origin',+lat.toFixed(5),+lng.toFixed(5),'我的位置');toast('已用 GPS 定位设置起点','ok');
    map.focus(+lat.toFixed(5),+lng.toFixed(5),16);
    placeName(+lat.toFixed(5),+lng.toFixed(5)).then(n=>renamePoint('origin',n));
  },()=>toast('定位失败，请手动选点','warn'),{timeout:5000});
};

// ---- map & call ----
function drawMarkers(){
  const m=[];
  if(origin)m.push({lat:origin.lat,lng:origin.lng,color:'#00b578',label:'起点'});
  if(dest)m.push({lat:dest.lat,lng:dest.lng,color:'#fa5151',label:'终点'});
  if(driverPos&&order&&['ACCEPTED','ARRIVED','IN_PROGRESS'].includes(order.status))m.push({lat:driverPos.lat,lng:driverPos.lng,color:'#10aeff',label:'司机'});
  map.setMarkers(m);
}
function setPoint(which,lat,lng,name){
  const p={lat,lng,name};
  if(which==='origin'){origin=p;$('originTxt').textContent=name;recommendPickup(p);}
  else{dest=p;$('destTxt').textContent=name;$('searchDestTxt').textContent=name;}
  drawMarkers();
  if(origin&&dest)quoteAll().catch(()=>{});
}
function pickOnMap(p){
  const which=mode;
  map.focus(p.lat,p.lng,16);
  setPoint(which,p.lat,p.lng,'定位中…');
  placeName(p.lat,p.lng).then(n=>renamePoint(which,n));
}
function renamePoint(which,name){
  if(which==='origin'){if(origin)origin.name=name;$('originTxt').textContent=name;}
  else{if(dest)dest.name=name;$('destTxt').textContent=name;$('searchDestTxt').textContent=name;}
  drawMarkers();
}
function recommendPickup(p){
  const el=$('pickupHint');let best=null,bd=1e9;
  PRESETS.forEach(x=>{const d=(x.lat-p.lat)**2+(x.lng-p.lng)**2;if(d<bd){bd=d;best=x;}});
  if(best&&bd<0.0004){el.style.display='block';el.textContent='📍 推荐上车点：'+best.name+'（点击采纳）';el.onclick=()=>{setPoint('origin',best.lat,best.lng,best.name);el.style.display='none';};}
  else el.style.display='none';
}
function paintSvc(){
  $('svcRow').innerHTML=SVC.map(s=>`<button data-svc="${s.k}" class="${svcSel.includes(s.k)?'on':''}">${s.n}<span class="p" id="q-${s.k}">--</span></button>`).join('');
  document.querySelectorAll('#svcRow button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.svc;
    if(svcSel.includes(k)){ if(svcSel.length>1) svcSel=svcSel.filter(x=>x!==k); }
    else svcSel=[...svcSel,k];
    serviceType=svcSel[0];paintSvc();paintFare();
  });
}
async function quoteAll(){
  await Promise.all(SVC.map(async s=>{
    try{quotes[s.k]=await api('POST','/api/pricing/quote',{originLat:origin.lat,originLng:origin.lng,destLat:dest.lat,destLng:dest.lng,serviceType:s.k});}catch{quotes[s.k]=null;}
    const el=$('q-'+s.k);if(el)el.textContent=quotes[s.k]?yuan(quotes[s.k].totalFee):'--';
  }));
  paintFare();
}
function couponSave(){
  if(!coupon||!quotes[svcSel[0]])return 0;
  const t=quotes[svcSel[0]].totalFee;
  if(coupon.type==='DISCOUNT')return Math.round(t*(100-coupon.benefit)/100);
  return Math.min(coupon.benefit,t);
}
function paintFare(){
  const f=quotes[svcSel[0]];
  $('fareBig').textContent=f?yuan(Math.max(0,f.totalFee-couponSave())):'--';
  $('fareMeta').innerHTML=(f?`预估 ${f.distanceKm}km · ${f.durationMin}分钟`:'预估价')+(f&&f.peakRate>1?` <span class="tag warn">高峰 ×${f.peakRate}</span>`:'')+(svcSel.length>1?` <span class="tag ok">同呼${svcSel.length}车型</span>`:'');
  $('fareDetail').innerHTML=f?`<details><summary class="muted small">计价明细</summary>${fareHtml(f)}</details>`:'';

async function openAddressSearch(which){

  const histEl=ov.querySelector('#aHist');
  histEl.innerHTML=hist.map((h,i)=>`<button data-h="${i}">🕒 ${escapeHtml(h.name)}</button>`).join('');
  histEl.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const h=hist[+b.dataset.h];choose(h);});

      ov.remove();return;

  const render=items=>{listEl.innerHTML=items.length?items.map(p=>`<div class="listitem" data-id="${p.id}"><div><b>${escapeHtml(p.name)}</b><div class="muted small">${escapeHtml(p.category||'')} · ${p.lat},${p.lng}</div></div><span class="tag">选择</span></div>`).join(''):'<div class="muted small">无匹配，试试地图点选</div>';
    listEl.querySelectorAll('.listitem').forEach(el=>el.onclick=()=>{const p=items.find(x=>x.id===el.dataset.id);choose(p);});};

}

    const res=await api('GET','/api/orders/query?'+q);
    $('histList').innerHTML=historyRowsHtml(res.items);
    bindHistoryRows($('histList'),oid=>openOrderDetail(oid,{userId:passenger.id}));
    renderPager($('histPager'),res.page,res.size,res.total,loadHistory);
    const paid=await api('GET','/api/orders/query?'+new URLSearchParams({passengerId:passenger.id,status:'PAID',page:1,size:100}));
    const spend=paid.items.reduce((s,o)=>s+(o.actualFee||0),0);
    const today=paid.items.filter(o=>o.paidAt>=dayStartTs(fmtDateInput())).length;
    $('histStats').innerHTML=`<div class="stat"><div class="n">${res.total}</div><div class="l">总订单</div></div><div class="stat"><div class="n green">${yuan(spend)}</div><div class="l">累计消费</div></div><div class="stat"><div class="n amber">${today}</div><div class="l">今日完成</div></div>`;
  }catch(e){toast(e.message,'err');}
}
$('hSearch').onclick=()=>loadHistory(1);
Object.keys(BIZ_LABEL).forEach(b=>$('wBiz').insertAdjacentHTML('beforeend',`<option value="${b}">${BIZ_LABEL[b]}</option>`));
async function loadWalletLedger(page){
  if(!passenger)return;walletPage=page;
  const q=new URLSearchParams({page,size:10});if($('wBiz').value)q.set('bizType',$('wBiz').value);
  try{const res=await api('GET',`/api/wallets/${passenger.id}/ledger?`+q);
    $('walletLedger').innerHTML=ledgerRowsHtml(res.items);
    renderPager($('walletPager'),res.page,res.size,res.total,loadWalletLedger);}catch(e){toast(e.message,'err');}
}
$('wSearch').onclick=()=>loadWalletLedger(1);
let topupPending=null;
$('btnTopup').onclick=async()=>{
  if(!passenger)return toast('请先选择身份','warn');
  const v=parseFloat($('topupAmount').value);if(!(v>0))return toast('充值金额需大于 0','warn');
  const amount=Math.round(v*100);const btn=$('btnTopup');btn.disabled=true;
  if(!topupPending||topupPending.amount!==amount)topupPending={amount,bizNo:'TOPUP-'+passenger.id+'-'+crypto.randomUUID().replace(/-/g,'')};
  try{await api('POST','/api/wallets/topup',{userId:passenger.id,amount,bizNo:topupPending.bizNo});topupPending=null;refreshWallet();loadWalletLedger(walletPage);toast('充值成功','ok');}
  catch(e){if(!e.status){toast('网络异常，充值结果确认中，重试不会重复入账','warn');refreshWallet();}else{topupPending=null;toast(e.message,'err');}}
  finally{btn.disabled=false;}
};
document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{$('topupAmount').value=b.dataset.amt;});
$('autoPayToggle').onchange=async()=>{
  if(!passenger){$('autoPayToggle').checked=false;return toast('请先选择身份','warn');}
  const enabled=$('autoPayToggle').checked;
  try{passenger=await api('POST',`/api/passengers/${passenger.id}/auto-pay?enabled=${enabled}`);toast(enabled?'已开启免密自动扣款':'已关闭免密自动扣款','ok');}
  catch(e){$('autoPayToggle').checked=!enabled;toast(e.message,'err');}
};

// ---- init ----
map=new MapView($('map'),p=>pickOnMap(p));
paintSvc();
(async()=>{
  const saved=localStorage.getItem('ride.passengerId');
  if(saved){try{selectPassenger(await api('GET','/api/passengers/'+saved));return;}catch{}}
  identityModal().catch(e=>toast(e.message,'err'));
})();
setInterval(()=>{if(passenger)refreshWallet();},8000);
setInterval(async()=>{
  if(!order||!order.driverId||!['ACCEPTED','ARRIVED','IN_PROGRESS'].includes(order.status))return;
  try{
    const loc=await api('GET','/api/locations/'+order.driverId);
    if(loc&&loc.lat!=null){driverPos={lat:loc.lat,lng:loc.lng};drawMarkers();updateEta();guardTrip();}
    if(order.status==='IN_PROGRESS'){const track=await api('GET','/api/locations/track/'+order.id);if(track&&track.length>1)map.setPath(track,'#10aeff');}
  }catch{}
},4000);
setInterval(()=>{if(order&&ACTIVE_STATUSES.includes(order.status))refreshOrder(order.id);},6000);
setInterval(()=>{if(passenger)loadNotifications();},15000);
setInterval(loadCampaign,20000);loadCampaign();
// ---- 无障碍/多语言 ----
let lang='zh';
const I18N={en:{call:'Call a ride',search:'Where to?',home:'Home',company:'Company',addr:'Addresses',gps:'Locate',orders:'Trips',wallet:'Wallet',me:'Me',origin:'Set pickup',dest:'Set drop-off'}};
function applyI18n(){
  const d=I18N[lang]||{};
  $('btnCall').textContent=d.call||'呼叫车辆';
  $('searchDestTxt').textContent=dest?dest.name:(d.search||'你要去哪儿？');
  if(!origin)$('originTxt').textContent=d.origin||'点击设置起点';
  if(!dest)$('destTxt').textContent=d.dest||'点击设置终点';
  document.querySelectorAll('.bottomnav button')[1].lastChild.textContent=d.orders||'订单';
  document.querySelectorAll('.bottomnav button')[2].lastChild.textContent=d.wallet||'钱包';
  document.querySelectorAll('.bottomnav button')[3].lastChild.textContent=d.me||'我的';
}
