<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>司机端 · ride-pro</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#8a94a6;--line:#e6e9f0;--green:#00b578;--red:#fa5151;--amber:#ff8f1f;--blue:#10aeff;--teal:#0e9f8a;--teal-d:#0b7f6f;--soft:#e2f6f2;--shadow:0 2px 12px rgba(31,36,48,.08);--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
button{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:9px 14px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
button.green{background:var(--green)}button.red{background:var(--red)}button.amber{background:var(--amber)}
button.block{width:100%}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--teal)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.sec{font-size:13px;font-weight:700;margin:14px 0 8px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef1f6;color:var(--muted)}
.badge.ok{background:#e6f9f1;color:var(--green)}.badge.err{background:#feecec;color:var(--red)}.badge.warn{background:#fff4e6;color:var(--amber)}.badge.info{background:#e8f7ff;color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{text-align:right;font-weight:600}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#39c0ab);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.top .name{font-weight:700}
.iconbtn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:16px;padding:0;flex:none}
.pane{display:none;flex:1;overflow-y:auto;padding:12px 12px 84px}
.pane.active{display:block}
#pane-home{padding:0;position:relative;overflow:hidden}
#map{width:100%;height:100%;position:absolute;inset:0;background:linear-gradient(160deg,#eef4ee,#f5f6fa)}
.home-top{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:center}
.statpill{background:#fff;border-radius:999px;box-shadow:var(--shadow);padding:7px 13px;font-size:12px;font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(31,36,48,.14);padding:16px 16px calc(16px + 62px);max-height:74%;overflow-y:auto}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.onlinebtn{width:86px;height:86px;border-radius:50%;font-size:16px;font-weight:800;box-shadow:0 8px 22px rgba(14,159,138,.35);margin:0 auto;display:block}
.onlinebtn.off{background:linear-gradient(135deg,var(--teal),#39c0ab)}
.onlinebtn.on{background:linear-gradient(135deg,var(--red),#ff7a7a);box-shadow:0 8px 22px rgba(250,81,81,.3)}
.offer{background:#fff;border:1.5px solid var(--teal);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.offer h3{font-size:14px;margin-bottom:6px}
.offer-bar{height:5px;border-radius:3px;background:#eef1f6;overflow:hidden;margin:6px 0}
.offer-bar i{display:block;height:100%;background:var(--teal)}
.offer .net{color:var(--green);font-weight:800}
.offer .cd{color:var(--red);font-weight:700}
.drivercard{display:flex;gap:11px;align-items:center;background:#f8f9fc;border-radius:12px;padding:11px}
.drivercard .avatar{width:44px;height:44px;font-size:18px}
.eta{background:#e8f7ff;color:var(--blue);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px;display:inline-block;margin-top:6px}
.primary-big{width:100%;padding:13px;font-size:15px;border-radius:12px}
.actrow{display:flex;gap:8px;margin-top:9px}.actrow button{flex:1;font-size:12.5px;padding:8px 4px}
.bottomnav{position:absolute;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:0}
.bottomnav button .ico{font-size:20px}.bottomnav button.active{color:var(--teal-d);font-weight:700}
.hist-item{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:9px;cursor:pointer}
.hist-route{font-weight:700}
.stats{display:flex;gap:9px}.stat{flex:1;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px;text-align:center}
.stat .n{font-size:19px;font-weight:800}.stat .n.green{color:var(--green)}.stat .n.amber{color:var(--amber)}
.stat .l{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}.filters>div{flex:1;min-width:110px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.money{font-size:32px;font-weight:800;color:var(--teal-d)}
.modal-overlay,.drawer-overlay{position:fixed;inset:0;background:rgba(31,36,48,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:18px 16px}
.modal h3{font-size:16px}.modal .btns{justify-content:flex-end}
.stars{font-size:26px;color:#d9dde5;cursor:pointer}.stars .on{color:var(--amber)}
.drawer-overlay{align-items:stretch;justify-content:flex-end}
.drawer{background:#fff;width:100%;max-width:520px;height:100%;overflow-y:auto;padding:16px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-head h3{font-size:16px}
.drawer-close{background:#f4f6fa;color:var(--text);border:0;width:32px;height:32px;border-radius:50%;padding:0}
.map.mini{width:100%;height:160px;border-radius:12px;background:#eef4ee}
.vtl{padding-left:6px}.vtl-item{display:flex;gap:9px;padding:5px 0}.vtl-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);margin-top:5px;flex:none}.vtl-label{font-weight:600;font-size:13px}
#toastStack{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:90vw}
.toast{background:rgba(31,36,48,.92);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;transition:.3s}
.toast.ok{background:var(--green)}.toast.warn{background:var(--amber)}.toast.err{background:var(--red)}.toast.out{opacity:0;transform:translateY(-8px)}
.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}.listitem:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eef1f6;color:var(--muted)}
.tag.ok{background:#e6f9f1;color:var(--green)}.tag.warn{background:#fff4e6;color:var(--amber)}.tag.err{background:#feecec;color:var(--red)}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--text);border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:13px 2px;font-size:14px;font-weight:600}
.menu button .arr{color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chips button{background:#f4f6fa;color:var(--text);border:1.5px solid transparent;border-radius:999px;font-size:12.5px;padding:6px 12px}
.chips button.on{background:var(--soft);border-color:var(--teal);color:var(--teal-d)}
.imbox{max-height:240px;overflow-y:auto;background:#f8f9fc;border-radius:12px;padding:10px;margin:10px 0}
.immsg{margin:6px 0;display:flex}.immsg.me{justify-content:flex-end}
.immsg span{max-width:75%;border-radius:12px;padding:8px 11px;font-size:13px;background:#fff;box-shadow:var(--shadow)}
.immsg.me span{background:var(--teal);color:#fff}
.scorewrap{display:flex;gap:14px;align-items:center}
.scorering{width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#eef1f6 0);display:grid;place-items:center;flex:none}
.scorering>div{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;color:var(--teal-d)}
canvas.chart{width:100%;height:120px;background:#f8f9fc;border-radius:12px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="avatar" id="avatar">?</span>
    <div style="flex:1"><div class="name" id="chipName">选择身份</div><div class="muted small" id="wsState">未连接</div></div>
    <span class="badge" id="driverStatus">已下线</span>
    <button class="iconbtn" id="btnSos" title="紧急求助">🆘</button>
  </header>

  <div class="pane active" id="pane-home">
    <canvas id="map"></canvas>
    <div class="home-top">
      <span class="statpill" id="onlineTime">在线 0 分钟</span>
      <span class="statpill" id="posPill">📍 --</span>
      <span class="statpill" id="todayPill">今日 ¥--</span>
      <button class="ghost" id="btnPref" style="margin-left:auto;border-radius:999px">⚙️ 听单偏好</button>
    </div>
    <div class="sheet" id="homeSheet">
      <div class="grip"></div>
      <div id="idleView">
        <button class="onlinebtn off" id="btnToggleOnline">出车</button>
        <p class="muted small" style="text-align:center;margin:10px 0" id="idleHint">出车后开始听单，邀约将按距离/服务分推送。</p>
        <div class="btns"><button class="ghost block" id="btnHeat">🔥 热区/接单指引</button></div>
        <div class="btns"><button class="ghost block" id="btnSimulate">🧭 导航演示（自动驶向目标）</button></div>
        <div id="offers" style="margin-top:12px"></div>
        <div id="noOffer" class="muted small">暂无邀约。出车并靠近乘客后收到推送。</div>
      </div>
      <div id="orderView" style="display:none">
        <div class="spread"><span class="badge info" id="orderId">--</span><span id="orderStatus"></span></div>
        <div class="drivercard" style="margin-top:10px">
          <span class="avatar" id="pAvatar">客</span>
          <div style="flex:1"><div style="font-weight:800" id="oPassenger">--</div><div class="muted small" id="oRoute">--</div><span class="eta" id="waitTimer" style="display:none"></span></div>
          <button class="ghost" id="btnIm" style="flex:none">💬 联系</button>
        </div>
        <div class="kv"><span class="k">预估 / 实际</span><span class="v" id="oFee">--</span></div>
        <div class="kv"><span class="k">预计收入（扣 20% 平台费）</span><span class="v" id="oIncome" style="color:var(--green)">--</span></div>
        <div class="kv" id="oComfortDRow" style="display:none"><span class="k">乘客偏好</span><span class="v" id="oComfortD">--</span></div>
        <div class="kv" id="oTipDRow" style="display:none"><span class="k">加价调度费</span><span class="v" id="oTipD" style="color:var(--amber)">--</span></div>
        <button class="primary-big" id="btnPrimary" disabled>--</button>
        <div class="actrow">
          <button class="ghost" id="btnNav">🧭 导航</button>
          <button class="red" id="btnDriverCancel">取消</button>
          <button class="ghost" id="btnDetail">详情</button>
        </div>
        <p class="muted small" id="primaryHint" style="margin-top:8px"></p>
      </div>
    </div>
  </div>

  <div class="pane" id="pane-history">
    <div class="stats" id="histStats" style="margin-bottom:12px"></div>
    <div class="card">
      <div class="filters">
        <div><label>状态</label><select id="hStatus"><option value="">全部</option></select></div>
        <div><label>开始</label><input type="date" id="hFrom"></div>
        <div><label>结束</label><input type="date" id="hTo"></div>
        <button id="hSearch">查询</button>
      </div>
      <div id="histList"></div><div class="pager" id="histPager"></div>
    </div>
  </div>

  <div class="pane" id="pane-income">
    <div class="card">
      <div class="muted small">收入余额</div><div class="money" id="balance">¥--</div>
      <div class="kv"><span class="k">可用</span><span class="v" id="availBalance">--</span></div>
      <div class="kv"><span class="k">提现冻结</span><span class="v" id="frozenBalance">--</span></div>
      <div class="stats" style="margin:12px 0">
        <div class="stat"><div class="n green" id="todayIncome">¥--</div><div class="l">今日收入</div></div>
        <div class="stat"><div class="n amber" id="serviceScore">--</div><div class="l">服务分</div></div>
      </div>
      <div class="btns"><button class="ghost block" id="btnScore">🏅 服务分详情</button><button class="ghost block" id="btnTasks">🎁 奖励任务</button></div>
      <label>近 7 日收入趋势</label><canvas class="chart" id="incomeChart"></canvas>
      <label>提现金额（元）</label><input id="withdrawAmount" type="number" value="50" min="1">
      <div class="btns"><button class="amber block" id="btnWithdraw">提现到银行卡（演示）</button></div>
      <div class="sec">提现记录</div><div id="withdrawList"><div class="muted small">暂无</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="spread"><b>收入流水</b><button class="ghost" id="wSearch">刷新</button></div>
      <div class="filters"><div><label>类型</label><select id="wBiz"><option value="">全部</option></select></div></div>
      <div id="walletLedger"></div><div class="pager" id="walletPager"></div>
    </div>
  </div>

  <div class="pane" id="pane-me">
    <div class="card">
      <div class="spread"><b id="meName">--</b><span class="badge" id="meSvc">--</span></div>
      <div class="muted small" id="meCar">--</div>
    </div>
    <div class="card menu" style="margin-top:12px">
      <button data-me="docs">📑 合规证件<span class="arr">›</span></button>
      <button data-me="reviews">⭐ 我的口碑<span class="arr">›</span></button>
      <button data-me="notifications">🔔 消息中心<span class="arr">›</span></button>
      <button data-me="pref">⚙️ 听单偏好<span class="arr">›</span></button>
      <button data-me="navset">🧭 导航/播报设置<span class="arr">›</span></button>
      <button data-me="fatigue">😴 疲劳与休息<span class="arr">›</span></button>
      <button data-me="training">📚 安全培训<span class="arr">›</span></button>
      <button data-me="energy">🔋 充电/加油<span class="arr">›</span></button>
      <button data-me="airport">✈️ 机场排队<span class="arr">›</span></button>
      <button data-me="invite">🎁 邀请司机<span class="arr">›</span></button>
      <button data-me="vehicle">🔧 车辆管理<span class="arr">›</span></button>
      <button data-me="settings">⚙️ 设置/切换身份<span class="arr">›</span></button>
    </div>
    <p class="muted small" style="margin:12px 4px"><a href="index.html" style="color:var(--muted)">门户</a> · <a href="passenger.html" style="color:var(--muted)">乘客端</a> · <a href="admin.html" style="color:var(--muted)">管理端</a></p>
  </div>

  <nav class="bottomnav">
    <button data-tab="home" class="active"><span class="ico">📍</span>接单</button>
    <button data-tab="history"><span class="ico">📋</span>订单</button>
    <button data-tab="income"><span class="ico">💰</span>收入</button>
    <button data-tab="me"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<script src="common.js"></script>
<script>
let driver=null,ws=null,order=null,map=null,pos=null,rated=false;
let simulating=false,simArrived=false,walletPage=1,onlineSince=null,waitSince=null;
let voice=true,pref={svcs:['EXPRESS','PREMIER','TAXI'],maxKm:5,onway:false,autoGrab:false};
const offers=new Map();
const $=id=>document.getElementById(id);

function switchTab(n){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+n));
  if(n==='history')loadHistory(1);
  if(n==='income'){refreshWallet();loadWalletLedger(1);loadWithdraws();refreshDriver();drawChart();}
  if(n==='me')renderMe();
  if(n==='home'&&map)setTimeout(()=>map.resize(),50);
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function setWsState(s){$('wsState').textContent=s==='connected'?'实时在线':'连接断开';}
function setStatusBadge(s){
  const el=$('driverStatus');
  el.textContent=s==='ONLINE'?'听单中':s==='BUSY'?'服务中':'已下线';
  el.className='badge '+(s==='ONLINE'?'ok':s==='BUSY'?'warn':'');
  const b=$('btnToggleOnline');
  b.textContent=s==='OFFLINE'?'出车':'收车';
  b.className='onlinebtn '+(s==='OFFLINE'?'off':'on');
}
// identity
async function identityModal(){
  const list=await api('GET','/api/drivers');
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal"><h3>选择司机身份</h3><label>已有司机</label><select id="mSelect"><option value="">请选择…</option>${list.map(d=>`<option value="${d.id}">${escapeHtml(d.name)} · ${escapeHtml(d.carNo)} · ${SERVICE_LABEL[d.serviceType]||'快车'} (${d.id})</option>`).join('')}</select>
    <div class="btns"><button class="block" id="mUse">使用选中身份</button></div>
    <label>或注册新司机</label><input id="mName" placeholder="姓名"><input id="mCarNo" placeholder="车牌" style="margin-top:8px"><input id="mCarModel" placeholder="车型（可选）" style="margin-top:8px">
    <select id="mService" style="margin-top:8px"><option value="EXPRESS">快车</option><option value="PREMIER">专车</option><option value="TAXI">出租车</option></select>
    <div class="btns"><button class="green block" id="mReg">注册并进入</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#mUse').onclick=async()=>{const id=ov.querySelector('#mSelect').value;if(!id)return toast('请先选择司机','warn');const d=await api('GET','/api/drivers/'+id);ov.remove();selectDriver(d);};
  ov.querySelector('#mReg').onclick=async()=>{const name=ov.querySelector('#mName').value.trim(),carNo=ov.querySelector('#mCarNo').value.trim();if(!name||!carNo)return toast('姓名与车牌必填','warn');const d=await api('POST','/api/drivers',{name,carNo,carModel:ov.querySelector('#mCarModel').value.trim(),serviceType:ov.querySelector('#mService').value});ov.remove();selectDriver(d);toast('注册成功 '+d.id,'ok');};
}
function selectDriver(d){
  driver=d;localStorage.setItem('ride.driverId',d.id);
  $('chipName').textContent=d.name;$('avatar').textContent=d.name.charAt(0);
  setStatusBadge(d.status);
  if(!pos)setPos(PRESETS[0].lat,PRESETS[0].lng,PRESETS[0].name);
  if(ws)ws.close();
  ws=connectWS('driver',d.id,onEvent,setWsState);
  order=null;rated=false;renderOrder();refreshWallet();loadActiveOrder();loadWithdraws();reportLocation();renderMe();
}
function setPos(lat,lng,name){pos={lat,lng,name};const pp=$('posPill');if(pp)pp.textContent='📍 '+(name||'--');drawMarkers();reportLocation();}
async function reportLocation(){
  if(!driver||!pos||driver.status==='OFFLINE')return;
  const body={driverId:driver.id,lat:pos.lat,lng:pos.lng};
  if(order&&order.passengerId&&['ACCEPTED','ARRIVED','IN_PROGRESS'].includes(order.status)){body.orderId=order.id;body.passengerId=order.passengerId;}
  try{await api('POST','/api/locations',body);}catch{}
}

function simulateTarget(){if(!order)return null;if(order.status==='ACCEPTED'||order.status==='ARRIVED')return{lat:order.originLat,lng:order.originLng};if(order.status==='IN_PROGRESS')return{lat:order.destLat,lng:order.destLng};return null;}

function guardDriver(){
  if(!order||order.status!=='IN_PROGRESS'||!pos||!order.originLat||!order.destLat)return;
  const total=distKm({lat:order.originLat,lng:order.originLng},{lat:order.destLat,lng:order.destLng});

  const d1=distKm({lat:order.originLat,lng:order.originLng},pos),d2=distKm(pos,{lat:order.destLat,lng:order.destLng});

async function drawChart(){
  if(!driver)return;
  const cv=$('incomeChart');const ctx=cv.getContext('2d');
  const res=await api('GET',`/api/wallets/${driver.id}/ledger?bizType=PAY_CREDIT&size=200`).catch(()=>({items:[]}));
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
  const sums=days.map(d=>{const s=new Date(d);s.setHours(0,0,0,0);const e=new Date(d);e.setHours(23,59,59,999);return res.items.filter(x=>x.createdAt>=s.getTime()&&x.createdAt<=e.getTime()).reduce((a,x)=>a+x.amount,0);});
  const max=Math.max(1,...sums);
  cv.width=cv.clientWidth*devicePixelRatio;cv.height=120*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=cv.clientWidth,h=120,bw=w/7;
  ctx.clearRect(0,0,w,h);
  sums.forEach((v,i)=>{const bh=v/max*(h-30);ctx.fillStyle='#0e9f8a';ctx.fillRect(i*bw+bw*0.25,h-20-bh,bw*0.5,bh);ctx.fillStyle='#8a94a6';ctx.font='10px sans-serif';ctx.fillText((days[i].getMonth()+1)+'/'+days[i].getDate(),i*bw+bw*0.2,h-6);});
}
