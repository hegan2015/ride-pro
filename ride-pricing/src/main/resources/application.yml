spring:
  application:
    name: ride-pricing
  main:
    web-application-type: none

dubbo:
  application:
    name: ride-pricing
    qos-enable: false
  registry:
    address: zookeeper://127.0.0.1:${ZK_PORT:2182}
  protocol:
    name: dubbo
    port: ${PRICING_DUBBO_PORT:20904}
  provider:
    timeout: 5000
    retries: 0
  consumer:
    check: false
    timeout: 5000
    retries: 0

# 计价规则（金额单位：分）。分车型费率 + 高峰/夜间系数 + 远途费 + 最低消费。
# EXPRESS 费率与 v1.2.0 一致；规则版本随配置内容自动变化，下单快照落订单。
pricing:
  services:
    EXPRESS:
      label: 快车
      base-fee: 1300
      base-km: 3.0
      per-km-fee: 230
      per-min-fee: 50
      min-fare: 1300
    PREMIER:
      label: 专车
      base-fee: 2000
      base-km: 3.0
      per-km-fee: 320
      per-min-fee: 80
      min-fare: 2000
    TAXI:
      label: 出租车
      base-fee: 1400
      base-km: 3.0
      per-km-fee: 250
      per-min-fee: 60
      min-fare: 1400
    CARPOOL:
      label: 拼车
      base-fee: 800
      base-km: 3.0
      per-km-fee: 150
      per-min-fee: 30
      min-fare: 800
    TEHUI:
      label: 特惠快车
      base-fee: 1000
      base-km: 3.0
      per-km-fee: 180
      per-min-fee: 40
      min-fare: 1000
    YOUXIANG:
      label: 优享
      base-fee: 1600
      base-km: 3.0
      per-km-fee: 270
      per-min-fee: 65
      min-fare: 1600
    LUXURY:
      label: 豪华车
      base-fee: 3500
      base-km: 3.0
      per-km-fee: 450
      per-min-fee: 120
      min-fare: 3500
  peak-windows:
    - label: 早高峰
      start-hour: 7
      end-hour: 9
      rate: 1.3
    - label: 晚高峰
      start-hour: 17
      end-hour: 19
      rate: 1.3
    - label: 夜间
      start-hour: 22
      end-hour: 6
      rate: 1.2
  long-distance-threshold-km: 15.0
  long-distance-per-km-fee: 100

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%t] %-40.40logger{39} : %m%n"
